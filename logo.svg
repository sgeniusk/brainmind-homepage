<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Between Brain and Mind profile logo">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="60%" stop-color="#10283E"/>
      <stop offset="100%" stop-color="#152D45"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FDBFF"/>
      <stop offset="100%" stop-color="#4FC3F7"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <circle cx="512" cy="512" r="390" fill="none" stroke="url(#ringGrad)" stroke-width="20" opacity="0.95"/>
  <circle cx="512" cy="512" r="355" fill="#0B1622" opacity="0.9"/>

  <!-- Brain hemisphere structure -->
  <g fill="none" stroke="url(#brainGrad)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M420 370C365 378 328 425 334 484C340 535 384 564 440 556" stroke-width="18"/>
    <path d="M440 556C468 598 534 606 579 574C618 546 635 490 624 442C612 390 569 360 524 362" stroke-width="18"/>
    <path d="M520 362C478 362 446 382 430 412" stroke-width="16"/>
    <path d="M394 420C422 424 439 445 439 470C439 494 423 516 396 522" stroke-width="14" opacity="0.85"/>
    <path d="M462 406C495 414 516 442 515 473C514 502 496 525 464 536" stroke-width="13" opacity="0.85"/>
    <path d="M530 424C560 433 579 456 578 482C577 507 561 527 534 536" stroke-width="12" opacity="0.8"/>
    <path d="M390 480L634 480" stroke-width="10" opacity="0.4"/>
  </g>

  <!-- Heart + emotional waveform bridge -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="M332 640C378 640 398 616 422 616C444 616 454 636 474 636C495 636 510 588 532 588C555 588 562 666 590 666C616 666 622 620 656 620C678 620 703 640 714 662" stroke="#4FC3F7" stroke-width="18"/>
    <path d="M484 704C454 674 413 648 413 610C413 576 440 552 471 552C490 552 507 561 518 578C529 561 546 552 565 552C596 552 623 576 623 610C623 648 581 674 552 704L518 735L484 704Z" fill="#FFD54F" stroke="#FFD54F" stroke-width="6"/>
  </g>

  <circle cx="512" cy="512" r="390" fill="none" stroke="#E8EAF6" stroke-width="2" opacity="0.35"/>
</svg>
